<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Survey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="survey-container">
            <div id="survey-content">Loading survey...</div>
            <button id="submit-btn" style="display:none;">Generate Result Code</button>
        </div>

        <div id="result-container" class="hidden">
            <h2>Survey Complete</h2>
            <p>Please copy the code below and text it to me:</p>
            <textarea id="output-code" readonly></textarea>
            <button onclick="copyToClipboard()">Copy Code</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
